<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile ✦ Vibely</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/theme.js"></script>
</head>
<body>

  <!-- Sticky Top Navigation Bar -->
  <header class="top-navbar">
    <div class="nav-container">
      <a href="feed.html" class="brand-logo">
        <span>VIBELY</span>
        <span class="brand-sparkle">✦</span>
      </a>

      <ul class="nav-center-menu">
        <li><a href="feed.html" class="top-nav-link">Home</a></li>
        <li><a href="explore.html" class="top-nav-link">Discover</a></li>
        <li><a href="feed.html?filter=following" class="top-nav-link">Following</a></li>
        <li><a href="activity.html" class="top-nav-link">Activity</a></li>
      </ul>

      <div class="nav-search-box">
        <svg class="nav-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="nav-search-input" placeholder="Search people, posts & topics..." onclick="window.location.href='explore.html'">
      </div>

      <div class="nav-actions">
        <a href="feed.html" class="btn btn-coral btn-sm">
          ＋ Create
        </a>

        <a href="messages.html" class="btn-icon nav-action-btn" title="Messages">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="nav-badge-pill" id="nav-msg-badge" style="display: none;"></span>
        </a>

        <a href="notifications.html" class="btn-icon nav-action-btn" title="Notifications">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="nav-badge-pill" id="nav-notif-badge" style="display: none;"></span>
        </a>

        <!-- User Profile Dropdown -->
        <div class="dropdown">
          <div class="avatar avatar-sm nav-avatar-placeholder" id="nav-avatar-trigger" style="cursor: pointer;" onclick="toggleProfileDropdown()">
            U
          </div>
          <div class="dropdown-menu" id="nav-profile-dropdown" style="width: 220px; right: 0;">
            <a href="profile.html" class="dropdown-item">👤 Profile</a>
            <a href="feed.html?filter=bookmarks" class="dropdown-item">🔖 Saved Posts</a>
            <a href="activity.html" class="dropdown-item">📊 Your Activity</a>
            <a href="settings.html" class="dropdown-item">⚙️ Settings</a>
            <div style="padding: 0.5rem 0.85rem; border-top: 1px solid var(--border-subtle); margin-top: 0.35rem;">
              <select class="form-control text-xs theme-select-input" onchange="VibelyTheme.set(this.value)">
                <option value="light">☀ Light Theme</option>
                <option value="dark">🌙 Dark Theme</option>
                <option value="system">🖥 System Theme</option>
              </select>
            </div>
            <button class="dropdown-item text-danger" onclick="handleLogout()" style="border-top: 1px solid var(--border-subtle); margin-top: 0.35rem;">🚪 Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Editorial Layout -->
  <div class="editorial-layout">

    <!-- Profile Main Stream Column -->
    <main>
      <div id="profile-header-container"></div>

      <!-- Profile Tabs Pill Bar -->
      <div class="profile-tabs-rail" id="profile-tabs-bar">
        <button class="profile-tab-pill active" data-tab="posts">Posts</button>
        <button class="profile-tab-pill" data-tab="replies">Replies</button>
        <button class="profile-tab-pill" data-tab="media">Media</button>
        <button class="profile-tab-pill" data-tab="likes">Liked</button>
        <button class="profile-tab-pill" data-tab="bookmarks">Saved</button>
      </div>

      <!-- Profile Posts Container -->
      <section id="profile-posts-container"></section>
    </main>

    <!-- Editorial Right Discovery Sidebar -->
    <aside class="editorial-sidebar">
      <div class="sidebar-widget">
        <h3 class="widget-heading">🔥 Trending Topics</h3>
        <div id="trending-widget-list"></div>
      </div>

      <div class="sidebar-widget">
        <h3 class="widget-heading">👥 Suggested for You</h3>
        <div id="suggested-users-list"></div>
      </div>
    </aside>

  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-bar">
    <div class="mobile-bottom-inner">
      <a href="feed.html" class="mobile-bottom-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Home</span>
      </a>
      <a href="explore.html" class="mobile-bottom-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Discover</span>
      </a>
      <a href="messages.html" class="mobile-bottom-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Messages</span>
      </a>
      <a href="notifications.html" class="mobile-bottom-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
        <span>Alerts</span>
      </a>
      <a href="profile.html" class="mobile-bottom-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </a>
    </div>
  </nav>

  <!-- Followers / Following Modal -->
  <div id="user-list-modal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="user-list-modal-title" style="font-size: 1.15rem; font-weight: 700;">Users</h3>
        <button class="btn-icon" onclick="document.getElementById('user-list-modal').classList.remove('active')">&times;</button>
      </div>
      <div class="modal-body" id="user-list-modal-body"></div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div id="edit-profile-modal" class="modal-backdrop">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="font-size: 1.15rem; font-weight: 700;">Edit Profile</h3>
        <button class="btn-icon" onclick="document.getElementById('edit-profile-modal').classList.remove('active')">&times;</button>
      </div>
      <div class="modal-body">
        <div style="display: flex; align-items: center; gap: 1.25rem; margin-bottom: 1.5rem;">
          <img id="edit-avatar-preview" src="" alt="Avatar Preview" class="avatar avatar-lg" style="object-fit: cover;">
          <div>
            <input type="file" id="edit-avatar-input" accept="image/png, image/jpeg, image/webp" style="display: none;">
            <div style="display: flex; gap: 0.5rem;">
              <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('edit-avatar-input').click()">
                Change Photo
              </button>
              <button type="button" id="edit-remove-avatar-btn" class="btn btn-ghost btn-sm text-danger">
                Remove
              </button>
            </div>
            <div class="text-muted text-xs" style="margin-top: 0.35rem;">JPG, PNG, WEBP up to 5MB</div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" id="edit-first-name" class="form-control">
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" id="edit-last-name" class="form-control">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Bio</label>
          <textarea id="edit-bio" class="form-control" maxlength="500" placeholder="Tell the community about yourself..."></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Location</label>
          <input type="text" id="edit-location" class="form-control" placeholder="e.g. San Francisco, CA">
        </div>

        <div class="form-group">
          <label class="form-label">Website</label>
          <input type="url" id="edit-website" class="form-control" placeholder="https://yourwebsite.com">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('edit-profile-modal').classList.remove('active')">Cancel</button>
        <button id="edit-profile-save-btn" class="btn btn-coral btn-sm">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Create Highlight Modal -->
  <div id="create-highlight-modal" class="modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title">New Story Highlight</h3>
        <button class="btn-icon" onclick="closeCreateHighlightModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Highlight Title</label>
          <input type="text" id="highlight-title-input" class="form-control" placeholder="e.g. Travels, Memories" maxlength="50">
        </div>
        <div class="form-group">
          <label class="form-label">Cover Photo (Optional)</label>
          <input type="file" id="highlight-cover-input" accept="image/*" class="form-control">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary btn-sm" onclick="closeCreateHighlightModal()">Cancel</button>
        <button class="btn btn-coral btn-sm" onclick="submitCreateHighlight()">Create Highlight</button>
      </div>
    </div>
  </div>

  <!-- Universal Media Lightbox Modal -->
  <div class="lightbox-modal" id="media-lightbox-modal" onclick="closeLightbox(event)">
    <button class="lightbox-close-btn" onclick="closeLightbox()">&times;</button>
    <div class="lightbox-content">
      <img id="lightbox-image-target" class="lightbox-img" src="" alt="Enlarged view">
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/comments.js"></script>
  <script src="js/profile.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await initNavigation(true);
      initProfilePage();
      loadTrendingWidget();
      loadSuggestedUsersWidget();
    });
  </script>
</body>
</html>
