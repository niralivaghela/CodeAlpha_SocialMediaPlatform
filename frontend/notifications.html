<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications ✦ Vibely</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/theme.js"></script>
</head>
<body>

  <!-- Sticky Top Navigation Bar -->
  <header class="top-navbar">
    <div class="nav-container">
      <a href="feed.html" class="brand-logo">
        <span>VIBELY</span>
        <span class="brand-sparkle">✦</span>
      </a>

      <ul class="nav-center-menu">
        <li><a href="feed.html" class="top-nav-link">Home</a></li>
        <li><a href="explore.html" class="top-nav-link">Discover</a></li>
        <li><a href="feed.html?filter=following" class="top-nav-link">Following</a></li>
        <li><a href="activity.html" class="top-nav-link">Activity</a></li>
      </ul>

      <div class="nav-search-box">
        <svg class="nav-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" class="nav-search-input" placeholder="Search people, posts & topics..." onclick="window.location.href='explore.html'">
      </div>

      <div class="nav-actions">
        <a href="feed.html" class="btn btn-coral btn-sm">
          ＋ Create
        </a>

        <a href="messages.html" class="btn-icon nav-action-btn" title="Messages">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
          <span class="nav-badge-pill" id="nav-msg-badge" style="display: none;"></span>
        </a>

        <a href="notifications.html" class="btn-icon nav-action-btn active" title="Notifications" style="color: var(--primary);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="nav-badge-pill" id="nav-notif-badge" style="display: none;"></span>
        </a>

        <!-- User Profile Dropdown -->
        <div class="dropdown">
          <div class="avatar avatar-sm nav-avatar-placeholder" id="nav-avatar-trigger" style="cursor: pointer;" onclick="toggleProfileDropdown()">
            U
          </div>
          <div class="dropdown-menu" id="nav-profile-dropdown" style="width: 220px; right: 0;">
            <a href="profile.html" class="dropdown-item">👤 Profile</a>
            <a href="feed.html?filter=bookmarks" class="dropdown-item">🔖 Saved Posts</a>
            <a href="activity.html" class="dropdown-item">📊 Your Activity</a>
            <a href="settings.html" class="dropdown-item">⚙️ Settings</a>
            <div style="padding: 0.5rem 0.85rem; border-top: 1px solid var(--border-subtle); margin-top: 0.35rem;">
              <select class="form-control text-xs theme-select-input" onchange="VibelyTheme.set(this.value)">
                <option value="light">☀ Light Theme</option>
                <option value="dark">🌙 Dark Theme</option>
                <option value="system">🖥 System Theme</option>
              </select>
            </div>
            <button class="dropdown-item text-danger" onclick="handleLogout()" style="border-top: 1px solid var(--border-subtle); margin-top: 0.35rem;">🚪 Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Editorial Layout -->
  <div class="editorial-layout">

    <!-- Notifications Main Stream Column -->
    <main>
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.75rem;">
        <div>
          <h1 style="font-size: 1.85rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 0.25rem;">
            Notifications ✦
          </h1>
          <p class="text-secondary text-sm">Real-time updates, interactions, and mentions.</p>
        </div>
        <button id="mark-all-read-btn" class="btn btn-secondary btn-sm">
          ✓ Mark All Read
        </button>
      </div>

      <!-- Filters Rail -->
      <div class="profile-tabs-rail" style="margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.35rem;">
        <button class="profile-tab-pill notif-filter-tab active" data-filter="all">All Notifications</button>
        <button class="profile-tab-pill notif-filter-tab" data-filter="social">Social</button>
        <button class="profile-tab-pill notif-filter-tab" data-filter="mentions">Mentions</button>
        <button class="profile-tab-pill notif-filter-tab" data-filter="messages">Messages</button>
        <button class="profile-tab-pill notif-filter-tab" data-filter="unread">Unread Only</button>
      </div>

      <!-- Notifications List Container -->
      <div id="notifications-list-container">
        <div class="text-muted text-center" style="padding: 2rem;">Loading notifications...</div>
      </div>
    </main>

    <!-- Editorial Right Sidebar -->
    <aside class="editorial-sidebar">
      <div class="sidebar-widget">
        <h3 class="widget-heading">🔥 Trending Topics</h3>
        <div id="trending-widget-list"></div>
      </div>
    </aside>

  </div>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-bar">
    <div class="mobile-bottom-inner">
      <a href="feed.html" class="mobile-bottom-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Home</span>
      </a>
      <a href="explore.html" class="mobile-bottom-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <span>Discover</span>
      </a>
      <a href="messages.html" class="mobile-bottom-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <span>Messages</span>
      </a>
      <a href="notifications.html" class="mobile-bottom-link active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path></svg>
        <span>Alerts</span>
      </a>
      <a href="profile.html" class="mobile-bottom-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        <span>Profile</span>
      </a>
    </div>
  </nav>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/notifications.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await initNavigation(true);
      initNotificationsPage();
      loadTrendingWidget();
    });
  </script>
</body>
</html>
