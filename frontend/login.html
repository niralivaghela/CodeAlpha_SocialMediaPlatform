<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In ✦ Vibely</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <script src="js/theme.js"></script>
</head>
<body class="auth-page-wrapper">

  <div class="auth-card">
    <div class="auth-brand" style="text-align: center; margin-bottom: 1.5rem;">
      <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 0.35rem;">
        <span>VIBELY</span>
        <span class="brand-sparkle">✦</span>
      </a>
      <div class="auth-tagline" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">"Share. Connect. Discover."</div>
    </div>

    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h1 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 0.25rem;">Welcome Back</h1>
      <p class="text-secondary text-sm">Sign in to share ideas, moments, and discussions.</p>
    </div>

    <form id="login-form">
      <div class="form-group">
        <label for="login-username" class="form-label font-bold">Username or Email</label>
        <input type="text" id="login-username" class="form-control" placeholder="alex_demo or you@example.com" required autocomplete="username">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="login-password" class="form-label font-bold" style="margin-bottom: 0;">Password</label>
        </div>
        <div style="position: relative;">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 2.75rem;">
          <button type="button" id="toggle-password-btn" class="btn-icon" style="position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 30px; height: 30px;" title="Show/hide password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; font-size: 0.875rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
          <input type="checkbox" id="remember-me" checked style="width: 16px; height: 16px; cursor: pointer; accent-color: var(--primary);">
          <span class="text-secondary font-medium">Keep me signed in</span>
        </label>
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-coral" style="width: 100%; padding: 0.85rem; font-size: 1rem; border-radius: var(--radius-full);">
        Sign In ✦
      </button>
    </form>

    <!-- Quick Demo Logins for Evaluator & Internship Grader -->
    <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px dashed var(--border-color); text-align: center;">
      <span class="text-muted text-xs font-bold" style="display: block; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">
        ⚡ Instant Evaluator Access
      </span>
      <div style="display: flex; gap: 0.5rem; justify-content: center; flex-wrap: wrap;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoCredentials('alex_demo')">
          👤 Alex (Engineer)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillDemoCredentials('sophia_demo')">
          👤 Sophia (Designer)
        </button>
        <button type="button" class="btn btn-secondary btn-sm" onclick="fillAdminCredentials()">
          🛡️ Admin (Staff)
        </button>
      </div>
    </div>

    <div class="auth-footer" style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-secondary);">
      Don't have an account? <a href="register.html" class="font-bold" style="color: var(--primary);">Create one free</a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function fillDemoCredentials(username) {
      document.getElementById('login-username').value = username;
      document.getElementById('login-password').value = 'DemoPassword123!';
      showToast(`Credentials loaded for @${username}`, 'info');
    }
    function fillAdminCredentials() {
      document.getElementById('login-username').value = 'admin';
      document.getElementById('login-password').value = 'admin123';
      showToast('Admin credentials loaded for @admin', 'info');
    }
  </script>
</body>
</html>
