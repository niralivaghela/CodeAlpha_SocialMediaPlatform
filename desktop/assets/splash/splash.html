<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VIBELY</title>
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <div class="splash-container">
    <div class="logo-wrapper">
      <img src="../icons/icon-128.png" alt="VIBELY Icon" class="splash-icon">
      <div class="icon-glow"></div>
    </div>
    
    <div class="brand-text">
      <h1 class="brand-name">VIBELY</h1>
      <p class="brand-tagline">Share. Connect. Discover.</p>
    </div>

    <div class="loader-wrapper">
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
      <span class="loading-status" id="loading-status">Starting up...</span>
    </div>
  </div>

  <script>
    const statuses = [
      'Starting up...',
      'Connecting to community...',
      'Loading your space...',
      'Ready'
    ];
    let idx = 0;
    const statusEl = document.getElementById('loading-status');
    const interval = setInterval(() => {
      idx++;
      if (idx < statuses.length) {
        statusEl.textContent = statuses[idx];
      } else {
        clearInterval(interval);
      }
    }, 600);
  </script>
</body>
</html>
